  <input type="text" [ngModel]="searchTerm()"
  (ngModelChange)="searchTerm.set($event)"
  placeholder="Search recipe..." />
  <ul>
    @for (recipe of filteredRecipes(); track recipe?.name) {
      <li>
        <a [routerLink]="['/recipes', recipe.id]">{{ recipe.name }}</a>
      </li>
    }
  </ul>
